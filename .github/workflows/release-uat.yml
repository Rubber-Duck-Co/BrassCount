name: Release to UAT (Google Play internal)

# Manual. Builds main, signs the bundle with the upload key and publishes it to
# the Play internal testing track. Run it from `main` (wait for the Version
# Bump workflow to finish first, so the bundle carries the new version); the
# UAT environment should also be limited to the main branch. The service
# account in the UAT environment must only be allowed to release to testing
# tracks. See docs/RELEASING.md for the setup.
#
# Actions are pinned to commits. The release job holds the signing secrets
# while it installs dependencies and runs Gradle, so keep those reviewed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-uat
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.rubberduckco.brasscount

jobs:
  release:
    name: Build and publish to UAT
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: UAT

    steps:
      - name: Only release main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Run this workflow from main, not $REF"
          exit 1

      - name: Only publish to a testing track
        env:
          TRACK: ${{ vars.PLAY_TRACK }}
        run: |
          # UAT must never publish to production: that is the PROD workflow's job.
          case "${TRACK:-internal}" in
            internal | alpha) ;;
            *)
              echo "::error::PLAY_TRACK must be internal or alpha, not '$TRACK'"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION.txt)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION.txt holds '$version', not a version like 1.2.3"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          # The commit is in the name so PROD can tell which build this was.
          echo "release_name=$version (${GITHUB_SHA::12})" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from ${GITHUB_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (matches android/build.gradle ext.versions)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 platform-tools'
          accept-android-sdk-licenses: true

      # No Gradle cache is saved from a job that holds the signing secrets.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-disabled: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint, type-check and test
        run: |
          npm run lint
          npm run typecheck
          npm run test:ci

      - name: Decode the upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 is not set on the UAT environment"
            exit 1
          fi
          # Readable by this user only.
          umask 077
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build the signed AAB
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_STORE_FILE: ${{ env.UPLOAD_KEYSTORE_PATH }}
          ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          cp ../.env.example ../.env
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Remove the upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Check the AAB is not signed with the debug key
        run: |
          certs="$(keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab)"
          if grep -qi "Android Debug" <<< "$certs"; then
            echo "::error::The AAB is signed with the debug certificate"
            exit 1
          fi
          grep -E "Owner:|SHA256:" <<< "$certs"
          echo "AAB sha256: $(sha256sum android/app/build/outputs/bundle/release/app-release.aab | cut -d' ' -f1)"

      # r0adkll/upload-google-play is pinned to a commit (v1.1.5), as it
      # receives the service account key.
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          # R8 mapping, so Play can read obfuscated crash stack traces.
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ steps.version.outputs.release_name }}
          # Internal testing unless the UAT environment sets PLAY_TRACK to
          # alpha (closed testing).
          tracks: ${{ vars.PLAY_TRACK || 'internal' }}
          # Set PLAY_RELEASE_STATUS to draft while Play has not yet accepted
          # the app for release. A draft is uploaded but not rolled out, so
          # PROD cannot promote it until it is rolled out.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
