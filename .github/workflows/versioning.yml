name: Version Bump

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run version bump
        uses: IanTerHaar/auto-version-bump@v3.1.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          app-private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          files: package.json,package-lock.json,VERSION.txt
          # The v* tag marks a version that reached production, so
          # release.yml creates it, not the bump.
          create-tag: false
