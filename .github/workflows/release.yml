name: Release (Google Play)

run-name: Release ${{ inputs.sha || 'tip of main' }}

# Moves one signed bundle through internal, closed and open testing to
# production, then tags it and publishes the GitHub release. Re-dispatch the
# same sha to finish a run that stopped part-way. Setup: docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character SHA of a version-bump commit on main. Empty = the tip of main.'
        required: false
        type: string

permissions:
  contents: read

# One release at a time, so an older run cannot promote over a newer one.
concurrency:
  group: play-release
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.rubberduckco.brasscount
  # Older commits build a debug-signed bundle that Play rejects.
  FIRST_RELEASABLE_SHA: ef4238dbf70998db36d985534a8c5fbc10cf4cea
  # Set to `draft` until the app is first published.
  RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
  # Change the version and checksum together.
  BUNDLETOOL_VERSION: '1.18.3'
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

# The repo and its logs are public:
#   - pass secrets through `env` on the one step that needs them, never ${{ }} in `run`;
#   - no `set -x` or verbose/debug flags on a step that holds a secret;
#   - pin actions to commits, and restore no caches;
#   - attach no release assets (the R8 mapping undoes the obfuscation);
#   - never put the bot key and the Play key in the same job.

jobs:
  build:
    name: Build signed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # For the upload-key secrets; it has no approval rule.
    environment: internal
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}

    steps:
      - name: Check where the run started and what it was given
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "::error::Run this workflow from main, not $GITHUB_REF. Pick the commit with the sha input."
            exit 1
          fi
          # checkout reads anything shorter as a branch or tag name.
          if [ -n "$INPUT_SHA" ] && ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The sha input must be a full 40-character commit SHA, not '$INPUT_SHA'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit is a releasable version bump
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$FIRST_RELEASABLE_SHA" "$sha"; then
            echo "::error::$sha is older than the upload-key signing setup ($FIRST_RELEASABLE_SHA) and cannot be released."
            exit 1
          fi
          if ! git diff --name-only "$sha^" "$sha" | grep -qx 'VERSION.txt'; then
            echo "::error::$sha does not change VERSION.txt. Release the version-bump commit that follows it on main."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (matches android/build.gradle ext.versions)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 platform-tools'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Bootstrap .env for build
        run: cp .env.example .env

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BRASSCOUNT_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The BRASSCOUNT_UPLOAD_KEYSTORE_BASE64 secret is not set. See docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      - name: Build the release bundle
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_STORE_PASSWORD: ${{ secrets.BRASSCOUNT_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_KEY_ALIAS: ${{ secrets.BRASSCOUNT_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_KEY_PASSWORD: ${{ secrets.BRASSCOUNT_UPLOAD_KEY_PASSWORD }}
        run: |
          export ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.keystore"
          ./gradlew --no-daemon bundleRelease

      - name: Remove the upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Read the version from the bundle
        id: version
        working-directory: android/app/build/outputs/bundle/release
        run: |
          jar="$RUNNER_TEMP/bundletool.jar"
          curl -fsSLo "$jar" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $jar" | sha256sum --check --quiet
          manifest() {
            java -jar "$jar" dump manifest --bundle app-release.aab --xpath "/manifest/@android:$1"
          }
          name="$(manifest versionName)"
          code="$(manifest versionCode)"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The bundle's version is '$name' (versionCode '$code'), not a version like 1.2.3 with a numeric code."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "### BrassCount $name (versionCode $code) from \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # The artifact holds bundle/release/app-release.aab and mapping/release/mapping.txt.
      - name: Upload the bundle and R8 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.version.outputs.name }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

  # The Play jobs use the Fastfile from main, not the one in the released commit.
  internal:
    name: Upload to internal testing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: internal

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The release notes read the history since the last production tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          working-directory: android

      - name: Install fastlane
        working-directory: android
        env:
          BUNDLE_FROZEN: 'true'
        run: bundle install

      # Play's "What's new", in the listing's default language. The promotions
      # carry it to every later track.
      - name: Write the Play release notes
        env:
          SHA: ${{ needs.build.outputs.sha }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
        run: |
          previous="$(git tag --merged "$SHA" --no-contains "$SHA" --list 'v*' --sort=-v:refname | head -n 1)"
          dir="$RUNNER_TEMP/play-metadata/en-GB/changelogs"
          mkdir -p "$dir"
          node scripts/release-notes.js --play "$SHA" ${previous:+"$previous"} > "$dir/$VERSION_CODE.txt"
          cat "$dir/$VERSION_CODE.txt"; echo

      - name: Download the bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.version-name }}
          path: ${{ runner.temp }}/release

      - name: Upload to the internal track
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          bundle exec fastlane android upload_internal \
            version_code:"$VERSION_CODE" \
            aab:"$RUNNER_TEMP/release/bundle/release/app-release.aab" \
            mapping:"$RUNNER_TEMP/release/mapping/release/mapping.txt" \
            metadata:"$RUNNER_TEMP/play-metadata"

  staging:
    name: Promote to closed testing
    needs: [build, internal]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          working-directory: android

      - name: Install fastlane
        working-directory: android
        env:
          BUNDLE_FROZEN: 'true'
        run: bundle install

      - name: Promote internal to closed testing
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: bundle exec fastlane android promote from:internal to:alpha version_code:"$VERSION_CODE"

  beta:
    name: Promote to open testing
    needs: [build, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: beta

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          working-directory: android

      - name: Install fastlane
        working-directory: android
        env:
          BUNDLE_FROZEN: 'true'
        run: bundle install

      - name: Promote closed testing to open testing
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: bundle exec fastlane android promote from:alpha to:beta version_code:"$VERSION_CODE"

  production:
    name: Promote to production
    needs: [build, beta]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          working-directory: android

      - name: Install fastlane
        working-directory: android
        env:
          BUNDLE_FROZEN: 'true'
        run: bundle install

      - name: Promote open testing to production
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: bundle exec fastlane android promote from:beta to:production version_code:"$VERSION_CODE"

  # Uses the bot's token so that its tags and releases trigger other workflows.
  publish-release:
    name: Tag and publish the GitHub release
    needs: [build, production]
    # A draft isn't live yet: re-dispatch once it is.
    if: (vars.PLAY_RELEASE_STATUS || 'completed') == 'completed'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create a token for the bot
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          # Also takes the numeric app ID.
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: v${{ needs.build.outputs.version-name }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          # A prefix match: v1.2.3 also finds v1.2.30.
          found="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq '.[] | select(.ref == "refs/tags/" + $ENV.TAG) | .object.type + " " + .object.sha')"
          if [ -z "$found" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$SHA" --silent
            echo "Tagged $SHA as $TAG."
            exit 0
          fi
          read -r type target <<< "$found"
          # Follow an annotated tag to its commit.
          while [ "$type" = tag ]; do
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" \
              --jq '.object.type + " " + .object.sha')"
            read -r type target <<< "$object"
          done
          if [ "$target" != "$SHA" ]; then
            echo "::error::$TAG already exists on $target, not on the released commit $SHA. Find out why before moving or deleting it."
            exit 1
          fi
          echo "$TAG is already on $SHA; skipping."

      # After tagging, so the new tag is fetched for the notes.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the GitHub release
        # With pipefail, so a failed tag listing stops the step.
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version-name }}
        run: |
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "The GitHub release for $TAG already exists; skipping."
            exit 0
          fi
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
              --jq '.[].ref | ltrimstr("refs/tags/")' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -uV)"
          if ! grep -qxF "$TAG" <<< "$tags"; then
            echo "::error::$TAG is not among the repository's tags, though the step before made or found it."
            exit 1
          fi
          # The notes start at the next-lower version's tag.
          previous="$(awk -v tag="$TAG" '$0 == tag { print prev } { prev = $0 }' <<< "$tags")"
          # The script needs no token.
          env -u GH_TOKEN node scripts/release-notes.js "$TAG" ${previous:+"$previous"} > "$RUNNER_TEMP/notes.md"
          options=()
          if [ "$(tail -n 1 <<< "$tags")" != "$TAG" ]; then
            options+=(--latest=false)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${options[@]}"
