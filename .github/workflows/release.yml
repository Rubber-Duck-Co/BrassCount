name: Release (Google Play)

run-name: Release ${{ inputs.sha || 'tip of main' }}

# Builds one signed bundle from a version-bump commit and moves that same
# bundle through the Play tracks: internal, then closed testing (behind the
# `staging` environment's approval), then production (behind `production`'s).
#
# Started two ways, both through workflow_dispatch:
#   - by hand, for any bump commit on main (this is how a patch is released);
#   - by versioning.yml, after a minor or major bump.
# It is not triggered by the tag push: the bump commit carries [skip ci].
#
# Every Play step is a lane in android/fastlane/Fastfile that skips itself
# when the build is already on the target track, so a release that stopped
# part-way is finished by dispatching it again for the same commit.
#
# Secrets and setup: docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character SHA of a version-bump commit on main. Empty = the tip of main.'
        required: false
        type: string

permissions:
  contents: read

# One release at a time, so an older run cannot promote over a newer one.
# A run waiting for approval holds the group, and GitHub keeps only one run
# queued behind it: dispatching a third cancels the queued one.
concurrency:
  group: play-release
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.rubberduckco.brasscount
  # The first commit whose release build is signed with the upload key.
  # Anything older would produce a debug-signed bundle that Play rejects.
  FIRST_RELEASABLE_SHA: ef4238dbf70998db36d985534a8c5fbc10cf4cea
  # Play only accepts `draft` releases through the API until the app has been
  # published once. Set the repository variable PLAY_RELEASE_STATUS to `draft`
  # until then, and delete it afterwards.
  RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
  # Reads the version back from the built bundle. The checksum is the one
  # GitHub publishes for the release asset; change both together.
  BUNDLETOOL_VERSION: '1.18.3'
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

# This repository is public, so every log line and artifact of a run is too.
# Rules this file keeps to, and that a change to it must keep:
#   - a secret is passed through `env` on the one step that needs it, never
#     written into a `run` script with ${{ }};
#   - no step that holds a secret prints its environment or runs with
#     `set -x`, `--verbose`, `--debug`, `--info` or `--stacktrace`;
#   - every action is pinned to a commit, so a moved tag cannot swap in code
#     that reads the secrets; fastlane and every gem it loads are pinned with
#     checksums by android/Gemfile.lock;
#   - no job restores a cache, which other workflows could have written;
#   - the artifact holds only what Play publishes anyway (bundle, R8 mapping).

jobs:
  build:
    name: Build signed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Declared so the job can read the upload-key secrets when they are stored
    # on the environment. `internal` has no approval rule.
    environment: internal
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}

    steps:
      - name: Check where the run started and what it was given
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "::error::Run this workflow from main, not $GITHUB_REF. Pick the commit with the sha input."
            exit 1
          fi
          # checkout reads anything shorter as a branch or tag name.
          if [ -n "$INPUT_SHA" ] && ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The sha input must be a full 40-character commit SHA, not '$INPUT_SHA'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha || github.sha }}
          # Full history: the checks below walk the ancestry.
          fetch-depth: 0
          # Do not leave the job's token in .git/config for later steps.
          persist-credentials: false

      - name: Check the commit is a releasable version bump
        run: |
          sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$FIRST_RELEASABLE_SHA" "$sha"; then
            echo "::error::$sha is older than the upload-key signing setup ($FIRST_RELEASABLE_SHA) and cannot be released."
            exit 1
          fi
          # Every other commit carries the previous bump's version number with
          # different code, so only a commit that changes VERSION.txt has a
          # version of its own.
          if ! git diff --name-only "$sha^" "$sha" | grep -qx 'VERSION.txt'; then
            echo "::error::$sha does not change VERSION.txt. Release the version-bump commit that follows it on main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (matches android/build.gradle ext.versions)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 platform-tools'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Bootstrap .env for build
        run: cp .env.example .env

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BRASSCOUNT_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The BRASSCOUNT_UPLOAD_KEYSTORE_BASE64 secret is not set. See docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      # All ABIs: no -PreactNativeArchitectures here, unlike the debug build.
      # build.gradle reads the four values as Gradle properties and fails the
      # build if any is missing, so a debug-signed bundle cannot come out.
      - name: Build the release bundle
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_STORE_PASSWORD: ${{ secrets.BRASSCOUNT_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_KEY_ALIAS: ${{ secrets.BRASSCOUNT_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_KEY_PASSWORD: ${{ secrets.BRASSCOUNT_UPLOAD_KEY_PASSWORD }}
        run: |
          export ORG_GRADLE_PROJECT_BRASSCOUNT_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.keystore"
          ./gradlew --no-daemon bundleRelease

      - name: Remove the upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      # Read from the bundle that is uploaded, not worked out from VERSION.txt
      # again, so the promote jobs always name the build Play actually has.
      - name: Read the version from the bundle
        id: version
        working-directory: android/app/build/outputs/bundle/release
        run: |
          jar="$RUNNER_TEMP/bundletool.jar"
          curl -fsSLo "$jar" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $jar" | sha256sum --check --quiet
          manifest() {
            java -jar "$jar" dump manifest --bundle app-release.aab --xpath "/manifest/@android:$1"
          }
          name="$(manifest versionName)"
          code="$(manifest versionCode)"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The bundle's version is '$name' (versionCode '$code'), not a version like 1.2.3 with a numeric code."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "### BrassCount $name (versionCode $code) from \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # The two paths share android/app/build/outputs, so the artifact holds
      # bundle/release/app-release.aab and mapping/release/mapping.txt.
      - name: Upload the bundle and R8 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.version.outputs.name }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

  # The three Play jobs check out this workflow's own commit (the tip of main)
  # for the Fastfile and Gemfile.lock, not the commit being released, which
  # may predate them.
  internal:
    name: Upload to internal testing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: internal

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          working-directory: android

      - name: Install fastlane
        working-directory: android
        env:
          BUNDLE_FROZEN: 'true'
        run: bundle install

      - name: Download the bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.version-name }}
          path: ${{ runner.temp }}/release

      - name: Upload to the internal track
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          bundle exec fastlane android upload_internal \
            version_code:"$VERSION_CODE" \
            aab:"$RUNNER_TEMP/release/bundle/release/app-release.aab" \
            mapping:"$RUNNER_TEMP/release/mapping/release/mapping.txt"

  staging:
    name: Promote to closed testing
    needs: [build, internal]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Waits for the environment's required reviewers.
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          working-directory: android

      - name: Install fastlane
        working-directory: android
        env:
          BUNDLE_FROZEN: 'true'
        run: bundle install

      - name: Promote internal to closed testing
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: bundle exec fastlane android promote from:internal to:alpha version_code:"$VERSION_CODE"

  production:
    name: Promote to production
    needs: [build, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Waits for the environment's required reviewers.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          working-directory: android

      - name: Install fastlane
        working-directory: android
        env:
          BUNDLE_FROZEN: 'true'
        run: bundle install

      # A completed release goes to every user at once: there is no staged rollout.
      - name: Promote closed testing to production
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: bundle exec fastlane android promote from:alpha to:production version_code:"$VERSION_CODE"
