name: Build (Android)

on:
  push:
    branches:
      [main, feat*/*, fix*/*, chore*/*, refactor*/*, build*/*, test*/*, ci*/*]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
    - cron: '0 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The APK version check below calls aapt2 from this build-tools version.
      - name: Setup Android SDK (matches android/build.gradle ext.versions)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 platform-tools'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle wrapper & caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Bootstrap .env for build
        run: cp .env.example .env

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a assembleDebug

      # Reads the version back out of the built APK, so a build that misread
      # VERSION.txt fails here. The formula is repeated on purpose: it checks
      # android/app/version.gradle rather than trusting it.
      - name: Check the APK version matches VERSION.txt
        run: |
          expected_name="$(tr -d '[:space:]' < VERSION.txt)"
          IFS=. read -r major minor patch <<< "$expected_name"
          expected_code=$((10#$major * 10000000 + 10#$minor * 10000 + 10#$patch))
          # Take the first line after aapt2 exits: head would close the pipe early
          # and, under pipefail, fail the step on a correct APK.
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging android/app/build/outputs/apk/debug/app-debug.apk)"
          badging="$(sed -n 1p <<< "$badging")"
          echo "VERSION.txt: $expected_name (versionCode $expected_code)"
          echo "APK:         $badging"
          if ! grep -qF "versionCode='$expected_code' versionName='$expected_name'" <<< "$badging"; then
            echo "::error::The APK's version does not match VERSION.txt ($expected_name, versionCode $expected_code)"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
